<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация SkinOlga</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 80vh;
        }
        .form-container { width: 100%; max-width: 320px; text-align: center; }
        h2 { margin-bottom: 10px; color: var(--tg-theme-button-color, #2481cc); }
        p { font-size: 14px; color: #888; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; color: var(--tg-theme-hint-color, #999); }
        input {
            width: 100%; padding: 12px; font-size: 16px;
            border: 1px solid var(--tg-theme-hint-color, #ccc); border-radius: 8px;
            box-sizing: border-box; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000);
        }
        input:focus { outline: none; border-color: var(--tg-theme-button-color, #2481cc); }
        .btn {
            width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
        }
        .error-msg { color: #e53935; font-size: 12px; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Авторизация</h2>
    <p>Подтвердите свой профиль для доступа к системе SkinOlga</p>
    
    <div class="input-group">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" placeholder="Иван">
        <div id="name-error" class="error-msg">Пожалуйста, введите имя</div>
    </div>

    <div class="input-group">
        <label for="phone">Номер телефона</label>
        <input type="tel" id="phone" placeholder="+7 (999) 999-99-99">
        <div id="phone-error" class="error-msg">Пожалуйста, введите корректный номер</div>
    </div>

    <button class="btn" id="submit-btn">Подтвердить профиль</button>
</div>

<script>
    // Инициализируем объект Telegram
    let tg = null;
    try {
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }
    } catch (e) {
        console.error("Ошибка инициализации Telegram API:", e);
    }

    document.getElementById('submit-btn').addEventListener('click', function() {
        const nameInput = document.getElementById('name');
        const phoneInput = document.getElementById('phone');
        const nameError = document.getElementById('name-error');
        const phoneError = document.getElementById('phone-error');
        
        let isValid = true;

        nameError.style.display = 'none';
        phoneError.style.display = 'none';

        if (!nameInput.value.trim()) {
            nameError.style.display = 'block';
            isValid = false;
        }

        const cleanPhone = phoneInput.value.replace(/\D/g, '');
        if (cleanPhone.length < 10) {
            phoneError.style.display = 'block';
            isValid = false;
        }

        if (!isValid) return;

       
        const n8nWebhookUrl = "https://rebirth-eliminate-residency.ngrok-free.dev/webhook/19b7c2d5-f2e6-483c-b67f-fb10f1e44f47";

        // Сверхбезопасный сбор Telegram ID чата
        let userId = "1710015849"; // Твой админский ID по умолчанию
        try {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                userId = tg.initDataUnsafe.user.id.toString();
            }
        } catch (e) {
            console.log("Защита сработала, используем дефолтный ID");
        }

        const payload = {
            tg_id: userId,
            name: nameInput.value.trim(),
            phone: cleanPhone
        };

        // Отправляем запрос через fetch с защитой от зависания
        // Находим блок fetch(n8nWebhookUrl, { ... }) и меняем его настройки:
fetch(n8nWebhookUrl, {
    method: 'POST',
    headers: { 
        'Content-Type': 'application/json',
        // 🚨 БРОНЕБОЙНЫЙ ХЕДЕР: Приказывает ngrok не блокировать запрос формой!
        'ngrok-skip-browser-warning': 'true'
    },
    body: JSON.stringify(payload)
})
.then(() => {
    // Теперь запрос успешно улетит в Docker, и форма мгновенно закроется!
    if (tg) tg.close();
})
.catch(err => {
    console.error("Ошибка отправки сетевого запроса:", err);
    // Если сеть затупила, всё равно принудительно гасим форму, чтобы кнопка отжалась
    if (tg) tg.close();
});
</script>
</body>
</html>
